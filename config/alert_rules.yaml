alerts:
  - name: HighLatencyAlert
    severity: warning
    condition: "latency_p95_ms > 2000 for 5m"
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateAlert
    severity: critical
    condition: "error_rate_pct > 2 for 3m"
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#alert-2
  - name: CostBudgetAlert
    severity: warning
    condition: "cost_usd > 2.5 for 1h"
    type: symptom-based
    owner: finance-team
    runbook: docs/alerts.md#alert-3
